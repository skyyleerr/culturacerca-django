{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Encuentra espacios culturales de Colombia mediante datos abiertos oficiales.">
  <title>{% block title %}CulturaCerca Colombia{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/styles.css' %}">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{% url 'core:home' %}" aria-label="CulturaCerca Colombia, inicio">
        <span class="brand-symbol" aria-hidden="true">✦</span>
        <span>Cultura<span class="brand-accent">Cerca</span><small>COLOMBIA</small></span>
      </a>
      <span class="topbar-tag">Datos abiertos · Cultura</span>
    </div>
  </header>
  <main id="contenido">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Proyecto académico · Hackathon 2026 · Equipo: Anthony, Karen y Juan.</p>
      <p>Fuente: <a href="{{ fuente_datos }}" target="_blank" rel="noopener noreferrer">Portal Nacional de Datos Abiertos</a></p>
    </div>
  </footer>
</body>
</html>
